[project]
name = "neryva-studio"
version = "0.1.0"
description = "Neryva Agent Studio - Governance and control layer for LLM applications"
requires-python = ">=3.12"
dependencies = [
    # Web framework and validation
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.0",
    
    # Agent orchestration
    "langgraph>=1.2",
    
    # Guardrails
    "nemoguardrails>=0.23.0",
    "guardrails-ai==0.10.0",
    
    # PII detection
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    
    # Observability
    "langfuse>=3.0",
    
    # RAG evaluation
    "ragas>=0.2",
    
    # Embeddings for governance classifiers
    "sentence-transformers>=2.7",
    "torch>=2.4",
    
    # Database
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    
    # Vector store
    "pgvector>=0.3",
    
    # Cache and queue
    "redis>=5.0",
    
    # HTTP client
    "httpx>=0.27",
    
    # Utilities
    "python-dotenv>=1.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

redteam = [
    "garak",
    "pyrit",
]

storage = [
    "aioboto3>=13.0",
]

all = [
    "neryva-studio[dev,redteam,storage]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
