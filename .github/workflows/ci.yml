name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check backend

      - name: Typecheck (mypy)
        run: mypy backend

      - name: Tests (pytest)
        run: pytest -q

      - name: Vulnerability audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --disable-pip

      - name: Vulnerability scan (osv-scanner)
        uses: google/osv-scanner-action@v2
        with:
          args: "--format=sarif --output=osv.sarif"
          fail-on-vuln: true

      - name: Upload osv-scanner SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: osv.sarif

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (pnpm)
        run: corepack enable && pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Vulnerability audit (pnpm audit)
        run: pnpm audit --prod

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build api worker

      - name: Trivy scan (API image)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: neryva-product-aaa/api
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Push images to GHCR (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for service in api worker; do
            docker tag neryva-product-aaa/$service:latest ghcr.io/${{ github.repository }}/$service:${GITHUB_SHA::8}
            docker tag neryva-product-aaa/$service:latest ghcr.io/${{ github.repository }}/$service:latest
            docker push ghcr.io/${{ github.repository }}/$service:${GITHUB_SHA::8}
            docker push ghcr.io/${{ github.repository }}/$service:latest
          done

  sbom:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate CycloneDX SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements --pyproject-only -o sbom.xml

      - uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.xml

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    concurrency: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging (SSH + compose)
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          echo "$STAGING_SSH_KEY" > /tmp/staging_key
          chmod 600 /tmp/staging_key
          export TAG=${GITHUB_SHA::8}
          scp -i /tmp/staging_key -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null docker-compose.yml \
            ubuntu@$STAGING_HOST:/srv/neryva/docker-compose.yml
          ssh -i /tmp/staging_key -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null ubuntu@$STAGING_HOST "
            set -euo pipefail
            export GHCR_TOKEN='$GHCR_TOKEN'
            echo \"\$GHCR_TOKEN\" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            cd /srv/neryva
            REGISTRY=ghcr.io/${{ github.repository }} TAG=$TAG docker compose pull api worker
            REGISTRY=ghcr.io/${{ github.repository }} TAG=$TAG docker compose up -d api worker
            for i in \$(seq 1 30); do
              if curl -fsS http://localhost:8000/health/live; then break; fi
              sleep 2
            done
            curl -fsS http://localhost:8000/health/live
          "
